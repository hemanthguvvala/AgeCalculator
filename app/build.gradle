plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    // Comment out if not used, but okay to keep consistent with Kotlin version
    id 'org.jetbrains.kotlin.plugin.compose' version '2.1.21'
    id 'com.google.dagger.hilt.android'
    id 'kotlin-kapt'
}

// Signing config from keystore.properties (gitignored). Falls back to debug
// signing when the file is missing so CI / fresh clones still build.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hasReleaseKeystore = keystorePropertiesFile.exists()
if (hasReleaseKeystore) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace 'com.hkgroups.agecalculator'
    compileSdk 36

    defaultConfig {
        applicationId "com.hkgroups.agecalculator"
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName "1.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Localization scope. Add locales here as translations are added.
        resourceConfigurations += ["en"]
    }

    if (hasReleaseKeystore) {
        signingConfigs {
            release {
                storeFile rootProject.file(keystoreProperties["storeFile"])
                storePassword keystoreProperties["storePassword"]
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            minifyEnabled false
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    packaging {
        resources {
            excludes += [
                'META-INF/AL2.0',
                'META-INF/LGPL2.1',
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/license.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/notice.txt',
                'META-INF/ASL2.0'
            ]
        }
    }
}

// Disable Hilt aggregating task to avoid annotation processing aggregation errors in multi-module projects
hilt {
    enableAggregatingTask = false
}

dependencies {
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.activity:activity-ktx:1.10.1'
    implementation 'androidx.activity:activity-compose:1.10.1'
    
    // Splash Screen
    implementation 'androidx.core:core-splashscreen:1.0.1'

    // Glance — Compose-based widgets for the cosmic-age home-screen widget.
    implementation 'androidx.glance:glance-appwidget:1.1.1'

    implementation platform('androidx.compose:compose-bom:2025.07.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material:material'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    implementation 'androidx.compose.material3:material3'
    implementation "com.airbnb.android:lottie-compose:6.6.7"
    implementation 'com.google.android.material:material:1.12.0'

    // Lifecycle and Navigation
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.9.2"
    implementation "androidx.navigation:navigation-compose:2.9.2"
    implementation "androidx.datastore:datastore-preferences:1.1.7"

    // Room Database
    implementation "androidx.room:room-runtime:2.7.0-alpha12"
    implementation "androidx.room:room-ktx:2.7.0-alpha12"
    kapt "androidx.room:room-compiler:2.7.0-alpha12"

    // Hilt dependencies (all aligned to 2.57)
    implementation "com.google.dagger:hilt-android:2.57"
    kapt "com.google.dagger:hilt-compiler:2.57"
    implementation "androidx.hilt:hilt-navigation-compose:1.2.0"
    implementation "androidx.hilt:hilt-work:1.2.0"

    implementation "androidx.work:work-runtime-ktx:2.10.3"

    implementation "org.jetbrains.kotlinx:kotlinx-collections-immutable:0.4.0"

    implementation 'com.google.code.gson:gson:2.13.1'

    // Lifecycle-aware Compose flow collection
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.2'

    // Facebook Audience Network — banners + interstitials. Rewarded video adds
    // later via the same SDK once a Rewarded Video placement exists.
    implementation 'com.facebook.android:audience-network-sdk:6.20.0'

    // Google's User Messaging Platform (UMP) — GDPR / EEA consent dialog.
    // Required by Meta + Play policy before serving ads in regulated regions.
    implementation 'com.google.android.ump:user-messaging-platform:3.0.0'

    // Google Play Billing — single non-consumable "premium_lifetime" SKU
    // unlocks ad-free + premium features.
    implementation 'com.android.billingclient:billing-ktx:7.1.1'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation platform('androidx.compose:compose-bom:2025.07.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
}

kapt {
    correctErrorTypes true
    arguments {
        arg("room.schemaLocation", "$projectDir/schemas")
        arg("room.incremental", "true")
    }
}
